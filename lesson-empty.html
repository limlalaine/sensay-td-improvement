5C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 11l2 2 4-4"/></svg>Teachers</a><a href="portal.html" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>Students</a><a href="portal.html" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Rosters</a><a href="portal.html" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>Classes</a><a href="portal.html" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/></svg>Plan &amp; billing</a></div><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#4A555C;font-weight:700;margin:0 0 6px 12px">HELP &amp; SUPPORT</div><a href="#" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10l6-3v10l-6-3z"/></svg>Tutorial Videos</a><a href="#" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg>Help Desk</a><a href="#" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/></svg>Contact Sensay</a></div></nav>
<label for="navtoggle" class="scrim" aria-hidden="true"></label>
<div style="flex: 999 1 560px; min-width: 0; background: #EEF2F5; font-family: 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; box-sizing: border-box; padding: 0 0 56px">
<div style="background: #FFFFFF; border-bottom: 1px solid #D5DCE1">
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; min-height: 72px">
<nav aria-label="Breadcrumb" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: #5F6B73">
<a href="classes.html" style="text-decoration: none; min-height: 32px; display: inline-flex; align-items: center">My Classes</a>
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#8A959C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
<a href="class-lessons.html" style="text-decoration: none; min-height: 32px; display: inline-flex; align-items: center">G5-B Reading Practice</a>
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#8A959C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
<a href="class-lessons.html" style="text-decoration: none; min-height: 32px; display: inline-flex; align-items: center">Lessons</a>
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#8A959C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
<span aria-current="page" style="color: #222222">{{lessonName}}</span>
</nav>
</div>
</div>

<div class="page-main" style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
<div>
<div style="font-size: 13px; font-weight: 700; color: #4A555C; text-transform: uppercase; letter-spacing: 0.04em">Lesson</div>
<h1 style="margin: 4px 0; font-family: Lato, sans-serif; font-weight: 700; font-size: 31px; line-height: 1.15; color: #111111">{{lessonName}}</h1>
<sc-if value="{{hasEx}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: #5F6B73"><span style="background: #D3EEDD; color: #1E5C3C; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700">Open until Dec 20, 2026</span><a href="#" style="font-size: 13px">storiestogrowby.org</a></div></sc-if><sc-if value="{{noEx}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 8px; align-items: center"><span style="background: #E2E7EB; color: #4A555C; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700">Always available</span></div></sc-if>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap">Edit lesson</button>
<sc-if value="{{hasEx}}" hint-placeholder-val="{{ true }}"><a href="exercise-builder.html" style="background: #00A094; border: 0; color: #FFFFFF; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; text-decoration: none">Edit exercises</a></sc-if><sc-if value="{{noEx}}" hint-placeholder-val="{{ false }}"><a href="exercise-create.html" style="background: #00A094; border: 0; color: #FFFFFF; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; text-decoration: none">Create exercises</a></sc-if>
</div>
</div>
<nav aria-label="Lesson sections" style="display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #D5DCE1">
<a href="lesson-exercises.html" aria-current="page" style="padding: 12px 16px; text-decoration: none; color: #0B6B63; font: 700 16px 'Noto Sans','Noto Sans TC',sans-serif; border-bottom: 3px solid #00A094; margin-bottom: -1px">Exercises <span style="background: #E2E7EB; border-radius: 999px; padding: 2px 8px; font-size: 13px">{{exCount}}</span></a>
<a href="lesson.html" style="padding: 12px 16px; text-decoration: none; color: #4A555C; font: 600 16px 'Noto Sans','Noto Sans TC',sans-serif">Results</a>
</nav>

<sc-if value="{{hasEx}}" hint-placeholder-val="{{ true }}"><section style="background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 2px rgba(17,17,17,0.06); overflow: hidden">
<div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 16px 20px; background: #F7F9FA; border-bottom: 1px solid #E2E7EB">
<span style="color: #5F6B73; font-size: 14px">{{exCount}} exercises · 640 recordings · drag <span style="display: inline-flex; vertical-align: middle"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="#8A959C"><circle cx="5.5" cy="3.5" r="1.3"/><circle cx="10.5" cy="3.5" r="1.3"/><circle cx="5.5" cy="8" r="1.3"/><circle cx="10.5" cy="8" r="1.3"/><circle cx="5.5" cy="12.5" r="1.3"/><circle cx="10.5" cy="12.5" r="1.3"/></svg></span> to reorder</span>
<button style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap">Export CSV</button>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; min-width: 900px">
<thead><tr><th scope="col" style="padding: 12px 8px 12px 16px; border-bottom: 1px solid #E2E7EB"><span style="position: absolute; left: -9999px">Reorder</span></th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">#</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Exercise</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Type</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Recordings</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Last recording</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Recording time</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Words read</th><th scope="col" style="padding: 12px 16px 12px 8px; border-bottom: 1px solid #E2E7EB"><span style="position: absolute; left: -9999px">Actions</span></th></tr></thead>
<tbody>
<sc-for list="{{exercises}}" as="e" hint-placeholder-count="5">
<tr onDragOver="{{e.dragOver}}" onDrop="{{e.drop}}" style="{{e.rowStyle}}">
<td style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px; padding-left: 16px; width: 32px"><span draggable="true" onDragStart="{{e.dragStart}}" onDragEnd="{{e.dragEnd}}" title="Drag to reorder" aria-label="Drag to reorder" style="display: inline-flex; cursor: grab; padding: 8px 4px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="#8A959C"><circle cx="5.5" cy="3.5" r="1.3"/><circle cx="10.5" cy="3.5" r="1.3"/><circle cx="5.5" cy="8" r="1.3"/><circle cx="10.5" cy="8" r="1.3"/><circle cx="5.5" cy="12.5" r="1.3"/><circle cx="10.5" cy="12.5" r="1.3"/></svg></span></td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px; width: 32px; color: #4A555C">{{e.n}}</td>

<script src="dc-lite.js"></script>
<script>
var EMPTY = true;
var LESSON = EMPTY ? 'The Gingerbread Man' : 'Goldilocks & the Three Bears';
function orderOf(ord, n) { var o = (ord || []).filter(function (k) { return k < n; }); for (var k = 0; k < n; k++) if (o.indexOf(k) < 0) o.push(k); return o; }
function dndRow(self, pos, label) {
  var st = self.state, dragging = st.drag !== null && st.drag !== undefined;
  return {
    dragStart: function (e) { try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(pos)); } catch (x) {} self.setState({ drag: pos }); },
    dragEnd: function () { self.setState({ drag: null, over: null }); },
    dragOver: function (e) { if (self.state.drag === null || self.state.drag === undefined) return; e.preventDefault(); if (self.state.over !== pos) self.setState({ over: pos }); },
    drop: function (e) {
      e.preventDefault(); var from = self.state.drag;
      if (from === null || from === undefined || from === pos) { self.setState({ drag: null, over: null }); return; }
      var o = self.curOrder.slice(), x = o.splice(from, 1)[0]; o.splice(pos, 0, x);
      self.setState({ prevOrd: self.curOrder.slice(), ord: o, drag: null, over: null, toast: label + ' order saved. Students see the new order.', undoOrd: true });
    },
    rowStyle: (dragging && st.over === pos && st.drag !== pos ? 'outline: 2px solid #00A094; outline-offset: -2px;' : '') + (st.drag === pos ? 'opacity: .5;' : '')
  };
}
function undoVals(self) {
  return { canUndo: !!self.state.toast && !!self.state.undoOrd, undo: function () { self.setState({ ord: self.state.prevOrd, prevOrd: null, undoOrd: false, toast: 'Order restored.' }); } };
}
var EXS = EMPTY ? [] : [
  { title: 'Part 1', preview: 'Once upon a time, there was a little girl named Goldilocks. She went for a walk in the forest…', type: 'Short Reading', recs: '150', last: '6 days ago', lastFull: 'Nov 18, 2026', time: '18:40', words: '2,310' },
  { title: 'Part 2', preview: 'She came upon a house. She knocked and, when no one answered, she walked right in…', type: 'Short Reading', recs: '140', last: '6 days ago', lastFull: 'Nov 18, 2026', time: '17:05', words: '2,060' },
  { title: 'Part 3', preview: 'At the table in the kitchen, there were three bowls of porridge…', type: 'Short Reading', recs: '130', last: '8 days ago', lastFull: 'Nov 16, 2026', time: '21:30', words: '2,480' },
  { title: 'Part 4', preview: 'After she ate the three bears’ breakfasts she decided she was feeling a little tired…', type: 'Long Reading', recs: '120', last: '8 days ago', lastFull: 'Nov 16, 2026', time: '14:55', words: '1,790' },
  { title: 'Part 5', preview: 'What would you do if you found Goldilocks in your house? Tell us in 3 sentences.', type: 'Question', recs: '100', last: '2 weeks ago', lastFull: 'Nov 10, 2026', time: '41:20', words: '3,105' }
];
var TYPE = {
  reading: { name: 'Reading', passage: true, label: 'Passage students read aloud', hint: 'Paste or type the text…', short: 'Reading · 30s' },
  image: { name: 'Reading w/ Image', passage: true, image: true, label: 'Passage students read aloud', hint: 'Paste or type the text…', short: 'Reading w/ Image' },
  speaking: { name: 'Speaking', passage: true, label: 'Question or prompt', hint: 'e.g. What would you do if you found Goldilocks in your house?', short: 'Speaking · 60s' },
  repeat: { name: 'Listen & repeat', passage: true, audio: true, label: 'Sentence to repeat', hint: 'e.g. Someone’s been eating my porridge!', short: 'Listen & repeat' }
};
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false, step: 1, type: null, title: '', passage: '', err: '', added: [], toast: '' }; }
  renderVals() {
    var self = this, st = this.state, T = st.type ? TYPE[st.type] : null;
    var all = EXS.concat(st.added), o = orderOf(st.ord, all.length); self.curOrder = o;
    var on = 'background:#E6F7F5;border:2px solid #00A094;', off = 'background:#FFFFFF;border:1px solid #D5DCE1;';
    var words = (st.passage || '').trim() ? st.passage.trim().split(/\s+/).length : 0;
    var v = {
      exercises: o.map(function (k, i) { return Object.assign({ n: i + 1, isNew: !!all[k].isNew }, all[k], dndRow(self, i, 'Exercise')); }),
      lessonName: LESSON, hasEx: all.length > 0, noEx: all.length === 0, canUndo: !!st.toast && !!st.undoOrd, undo: function () { self.setState({ ord: self.state.prevOrd, prevOrd: null, undoOrd: false, toast: 'Order restored.' }); },
      exCount: all.length, nextN: all.length + 1,
      exOpen: st.open, step1: st.step === 1, step2: st.step === 2, step3: st.step === 3, showBack: st.step > 1,
      nextLabel: st.step === 3 ? 'Add exercise' : 'Next',
      exTitleVal: st.title, exPassage: st.passage, wordCount: words, readSecs: Math.max(0, Math.round(words / 2.2)),
      needsPassage: !!(T && T.passage), needsImage: !!(T && T.image), needsAudio: !!(T && T.audio),
      passageLabel: T ? T.label : '', passageHint: T ? T.hint : '',
      summaryType: T ? T.name : '', summaryTitle: st.title || 'Untitled',
      exErr: !!st.err, exErrText: st.err,
      openEx: function () { self.setState({ open: true, step: 1, type: null, title: 'Part ' + (EXS.length + self.state.added.length + 1), passage: '', err: '', toast: '' }); },
      closeEx: function () { self.setState({ open: false, err: '' }); },
      backEx: function () { self.setState({ step: Math.max(1, self.state.step - 1), err: '' }); },
      onExTitle: function (e) { self.setState({ title: e.target.value, err: '' }); },
      onPassage: function (e) { self.setState({ passage: e.target.value, err: '' }); },
      previewEx: function () { self.setState({ toast: 'Preview opens in a new tab in the real product.' }); },
      nextEx: function () {
        var s = self.state;
        if (s.step === 1) { if (!s.type) { self.setState({ err: 'Choose what students should do.' }); return; } self.setState({ step: 2, err: '' }); return; }
        if (s.step === 2) {
          if (!(s.title || '').trim()) { self.setState({ err: 'Give the exercise a title.' }); return; }
          if (!(s.passage || '').trim()) { self.setState({ err: 'Add the ' + TYPE[s.type].label.toLowerCase() + '.' }); return; }
          self.setState({ step: 3, err: '' }); return;
        }
        var e = { title: s.title.trim(), preview: s.passage.trim(), type: TYPE[s.type].short, recs: '0', last: '–', lastFull: 'No recordings yet', time: '–', words: '–', isNew: true };
        self.setState({ added: s.added.concat([e]), open: false, toast: '“' + e.title + '” added to the lesson.' });
      },
      toast: !!st.toast, toastText: st.toast, dismissToast: function () { self.setState({ toast: '' }); }
    };
    ['reading', 'image', 'speaking', 'repeat'].forEach(function (k) {
      v['on_' + k] = st.type === k; v['st_' + k] = st.type === k ? on : off;
      v['pick_' + k] = function () { self.setState({ type: k, err: '' }); };
    });
    [1, 2, 3].forEach(function (n) {
      var done = st.step > n, cur = st.step === n;
      v['s' + n + 'Bg'] = done || cur ? '#00A094' : '#E2E7EB'; v['s' + n + 'DotFg'] = done || cur ? '#FFFFFF' : '#4A555C'; v['s' + n + 'Fg'] = cur ? '#0B6B63' : '#4A555C';
    });
    return v;
  }
}
mountDC(Component, 'tpl', 'app');
</script>
