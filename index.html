<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Overview · Sensay Teacher Platform (mockup)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6B63}a:hover{color:#1A4A47}
table{border-collapse:separate;border-spacing:0}
th,td{vertical-align:middle}
.sk{position:sticky;z-index:2}
thead th,thead td{position:sticky;z-index:3}
thead .sk{z-index:5}
.burger,.nav-close{display:none}
.nav-toggle{position:absolute;opacity:0;width:1px;height:1px}
.nav-toggle:focus-visible~header .burger{outline:2px solid #FFFFFF;outline-offset:2px}
.scrim{display:none;position:fixed;inset:0;background:rgba(17,17,17,.4);z-index:50}
@media (max-width:1023px){.burger{display:inline-flex!important}.side-nav{display:none!important}
.nav-toggle:checked~* .side-nav{display:flex!important;position:fixed;top:0;left:0;bottom:0;z-index:60;width:280px!important;overflow-y:auto;box-shadow:0 8px 24px rgba(17,17,17,.2)}
.nav-toggle:checked~* .scrim{display:block}.nav-toggle:checked~* .nav-close{display:flex}}
@media (max-width:720px){.hdr-search{display:none!important}.app-header{padding:12px 16px!important}.logo{font-size:28px!important}main,.page-main{padding:20px 16px 40px!important}.kpi-row{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="tpl">
<div style="min-height:1500px;background:#EEF2F5">
<input type="checkbox" id="navtoggle" class="nav-toggle" aria-label="Show navigation menu">
<header class="app-header" style="background:#00A094;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:16px 32px;font-family:'Noto Sans','Noto Sans TC',sans-serif">
<div style="display:flex;align-items:center;gap:8px"><label for="navtoggle" class="burger" aria-label="Open menu" style="align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;cursor:pointer;color:#FFFFFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></label><div class="logo" style="font-size:36px;font-weight:700;color:#fff;letter-spacing:-0.5px">sensay</div></div>
<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
<label class="hdr-search" style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:10px 16px;width:320px;color:#5F6B73;font-size:14px"><span>Search students, classes, lessons…</span></label>
<button style="display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;font:inherit;font-size:16px;cursor:pointer"><span style="width:40px;height:40px;border-radius:50%;background:#E6F7F5;color:#0B6B63;display:flex;align-items:center;justify-content:center;font-weight:700">L</span>L ▾</button>
</div>
</header>
<div style="display:flex;flex-wrap:wrap">
<nav aria-label="Main" class="side-nav" style="flex:0 0 240px;width:240px;padding:24px 16px;border-right:1px solid #E2E7EB;background:#FFFFFF;box-sizing:border-box;display:flex;flex-direction:column;gap:24px;font-family:'Noto Sans','Noto Sans TC',sans-serif">
<label for="navtoggle" class="nav-close" style="align-items:center;gap:8px;align-self:flex-end;min-height:44px;padding:0 12px;border-radius:8px;cursor:pointer;color:#4A555C;font-size:14px;font-weight:600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Close</label><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#4A555C;font-weight:700;margin:0 0 6px 12px">MY TEACHING</div><a href="portal.html" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Dashboard</a><a href="index.html" aria-current="page" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#0B6B63;font-weight:700;background:#E6F7F5">My Classes</a><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">All Recordings</a><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Practice Packs</a></div><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#4A555C;font-weight:700;margin:0 0 6px 12px">ORGANIZATION MANAGEMENT</div><a href="portal.html" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Overview</a><a href="portal.html" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Teachers</a><a href="portal.html" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Students</a><a href="portal.html" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Rosters</a><a href="portal.html" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Classes</a><a href="portal.html" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Plan &amp; billing</a></div><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#4A555C;font-weight:700;margin:0 0 6px 12px">HELP &amp; SUPPORT</div><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Tutorial Videos</a><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Help Desk</a><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Contact Sensay</a></div></nav>
<label for="navtoggle" class="scrim" aria-hidden="true"></label>
<div class="page-main" style="flex: 999 1 560px; min-width: 0; background: #EEF2F5; font-family: 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; box-sizing: border-box; padding: 32px 24px 56px">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; color: #5F6B73"><a href="#" style="text-decoration: none">My Classes</a> / [Class name]</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<h1 style="margin: 0; font-family: Lato, sans-serif; font-weight: 700; font-size: 31px; line-height: 1.1; color: #111111">[Class name]</h1>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #C0C0C0; background: #FFFFFF; color: #222222; font: 600 14px 'Noto Sans',sans-serif; cursor: pointer">Export report</button>
</div>
</div>
</div>

<nav aria-label="Class sections" style="display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #D5DCE1">
<a href="#" style="padding: 12px 16px; text-decoration: none; color: #4A555C; font: 600 16px 'Noto Sans',sans-serif">Lessons <span style="background: #E2E7EB; border-radius: 999px; padding: 2px 8px; font-size: 13px">4</span></a>
<a href="#" style="padding: 12px 16px; text-decoration: none; color: #4A555C; font: 600 16px 'Noto Sans',sans-serif">Students <span style="background: #E2E7EB; border-radius: 999px; padding: 2px 8px; font-size: 13px">12</span></a>
<a href="#" aria-current="page" style="padding: 12px 16px; text-decoration: none; color: #0B6B63; font: 700 16px 'Noto Sans',sans-serif; border-bottom: 3px solid #00A094; margin-bottom: -1px">Class Overview</a>
<a href="#" style="padding: 12px 16px; text-decoration: none; color: #4A555C; font: 600 16px 'Noto Sans',sans-serif">Analytics <span style="font-weight: 400; font-size: 13px; color: #5F6B73">· trends</span></a>
<a href="#" style="padding: 12px 16px; text-decoration: none; color: #4A555C; font: 600 16px 'Noto Sans',sans-serif">Co-Teachers</a>
</nav>

<div class="kpi-row" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border-radius: 12px; padding: 16px 24px; box-shadow: 0 1px 2px rgba(17,17,17,0.06)">
<div style="font-size: 13px; color: #5F6B73; font-weight: 600">Class average</div>
<div style="font-family: Lato, sans-serif; font-size: 31px; font-weight: 900; color: #111111">{{classOverall}}</div>
<div style="font-size: 13px; color: #5F6B73">Average of each student's overall score</div>
</div>
<button type="button" onClick="{{showAttention}}" aria-pressed="{{attnOn}}" style="text-align: left; background: #FFFFFF; border-radius: 12px; padding: 16px 24px; box-shadow: 0 1px 2px rgba(17,17,17,0.06); border: {{attnCardBorder}}; cursor: pointer; font-family: 'Noto Sans',sans-serif">
<div style="font-size: 13px; color: #5F6B73; font-weight: 600">Needs attention</div>
<div style="font-family: Lato, sans-serif; font-size: 31px; font-weight: 900; color: #A15C00">{{attnCount}} <span style="font-size: 18px; font-weight: 700; color: #5F6B73">students</span></div>
<div style="font-size: 13px; color: #5F6B73">Under 50% complete, overall under 70, or an exercise under 60 →</div>
</button>
<div style="background: #FFFFFF; border-radius: 12px; padding: 16px 24px; box-shadow: 0 1px 2px rgba(17,17,17,0.06)">
<div style="font-size: 13px; color: #5F6B73; font-weight: 600">Teacher-adjusted scores</div>
<div style="font-family: Lato, sans-serif; font-size: 31px; font-weight: 900; color: #4357AD">{{overrideCount}}</div>
<div style="font-size: 13px; color: #5F6B73">Exercise scores where your score replaces the AI score</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<div style="flex: 999 1 640px; min-width: 0; background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 2px rgba(17,17,17,0.06); overflow: hidden">

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; padding: 16px 24px; background: #F7F9FA; border-bottom: 1px solid #E2E7EB">
<div role="group" aria-label="Students shown" style="display: flex; gap: 4px; background: #E2E7EB; padding: 4px; border-radius: 10px">
<button type="button" onClick="{{showAll}}" aria-pressed="{{allOn}}" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{allBg}}; color: #222222; font: 600 14px 'Noto Sans',sans-serif; cursor: pointer">All students ({{studentCount}})</button>
<button type="button" onClick="{{showAttention}}" aria-pressed="{{attnOn}}" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{attnBg}}; color: #222222; font: 600 14px 'Noto Sans',sans-serif; cursor: pointer">Needs attention ({{attnCount}})</button>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #4A555C; flex: 1 1 200px">Student name
<input type="search" value="{{q}}" onInput="{{onSearch}}" placeholder="Search students" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C0C0C0; border-radius: 8px; font: 400 15px 'Noto Sans','Noto Sans TC',sans-serif; background: #FFFFFF">
</label>
</div>

<sc-if value="{{attnOn}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 12px 24px; background: #FDF5E6; border-bottom: 1px solid #F3DDB0">
<div style="font-size: 14px; color: #5C3D00"><span style="font-weight: 700">{{attnCount}} students need attention.</span> Each row lists why.</div>
<button type="button" onClick="{{remindAll}}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #00A094; color: #FFFFFF; font: 700 14px 'Noto Sans',sans-serif; cursor: pointer">Send reminder to {{attnCount}} students</button>
</div>
</sc-if>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 8px; padding: 12px 24px; background: #E7F3EB; color: #24543A; font-size: 14px; font-weight: 600; border-bottom: 1px solid #CFE6D7">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#24543A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>{{toast}}
</div>
</sc-if>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 24px; font-size: 12px; color: #4A555C; border-bottom: 1px solid #E2E7EB">
<span style="font-weight: 700">Best score:</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 16px; border-radius: 4px; background: #D3EEDD"></span>70+</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 16px; border-radius: 4px; background: #FDEFD3"></span>60–69</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 16px; border-radius: 4px; background: #FBE1E1"></span>Below 60</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 16px; border-radius: 4px; border: 1.5px dashed #A9B3BA; box-sizing: border-box"></span>Not started</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 16px; border-radius: 4px; background: #D3EEDD; box-shadow: inset 0 0 0 2px #4357AD"></span>Teacher-adjusted</span>
<span style="display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A15C00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.2v.1"/></svg>An attempt may have a recording problem</span>
</div>

<div style="overflow-x: auto">
<table style="min-width: 100%; font-size: 14px">
<thead>
<tr>
<th rowspan="2" scope="col" class="sk" style="top: 0; left: 0; width: 56px; min-width: 56px; box-sizing: border-box; background: #FFFFFF; text-align: left; padding: 0 8px 12px 24px; border-bottom: 1px solid #E2E7EB; vertical-align: bottom">
<button type="button" onClick="{{sortNo}}" style="border: 0; background: none; padding: 0; font: 600 13px 'Noto Sans',sans-serif; color: #5F6B73; cursor: pointer; min-height: 32px">No. {{icoNo}}</button>
</th>
<th rowspan="2" scope="col" class="sk" style="top: 0; left: 56px; width: 200px; min-width: 200px; box-sizing: border-box; background: #FFFFFF; text-align: left; padding: 0 8px 12px; border-bottom: 1px solid #E2E7EB; vertical-align: bottom">
<button type="button" onClick="{{sortName}}" style="border: 0; background: none; padding: 0; font: 700 14px 'Noto Sans',sans-serif; color: #111111; cursor: pointer; min-height: 32px">Student {{icoName}}</button>
</th>
<th rowspan="2" scope="col" class="sk" style="top: 0; left: 256px; width: 112px; min-width: 112px; box-sizing: border-box; background: #FFFFFF; text-align: left; padding: 0 8px 12px; border-bottom: 1px solid #E2E7EB; vertical-align: bottom">
<button type="button" onClick="{{sortComp}}" style="border: 0; background: none; padding: 0; font: 700 14px 'Noto Sans',sans-serif; color: #111111; cursor: pointer; min-height: 32px">Completion {{icoComp}}</button>
</th>
<th rowspan="2" scope="col" class="sk" style="top: 0; left: 368px; width: 104px; min-width: 104px; box-sizing: border-box; background: #FFFFFF; text-align: center; padding: 0 8px 12px; border-bottom: 1px solid #E2E7EB; border-right: 1px solid #E2E7EB; vertical-align: bottom">
<div style="display: inline-flex; align-items: center; gap: 4px">
<button type="button" onClick="{{sortOverall}}" style="border: 0; background: none; padding: 0; font: 700 14px 'Noto Sans',sans-serif; color: #111111; cursor: pointer; min-height: 32px">Overall score {{icoOverall}}</button>
<button type="button" onClick="{{toggleInfo}}" aria-label="How Overall is calculated" aria-expanded="{{infoOn}}" style="width: 28px; height: 28px; border: 0; border-radius: 50%; background: #EEF2F5; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#4A555C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v4M8 4.8v.1"/></svg></button>
</div>
</th>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<th colspan="{{g.span}}" scope="colgroup" style="top: 0; height: 44px; box-sizing: border-box; background: #F7F9FA; padding: 4px 8px; border-bottom: 1px solid #E2E7EB; border-right: 1px solid #E2E7EB; text-align: left; white-space: nowrap">
<div style="display: flex; align-items: center; gap: 8px; justify-content: space-between">
<a href="{{g.href}}" title="Open lesson overview" style="font: 700 14px 'Noto Sans',sans-serif; color: #0B6B63; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; display: inline-flex; align-items: center">{{g.name}}</a>
<sc-if value="{{g.canToggle}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.open}}" style="min-height: 32px; padding: 0 10px; border: 1px solid #C0C0C0; border-radius: 8px; background: #FFFFFF; font: 600 12px 'Noto Sans',sans-serif; color: #222222; cursor: pointer">{{g.toggleLabel}}</button>
</sc-if>
</div>
</th>
</sc-for>
</tr>
<tr>
<sc-for list="{{cols}}" as="col" hint-placeholder-count="6">
<th scope="col" style="top: 44px; height: 56px; box-sizing: border-box; background: #FFFFFF; text-align: center; padding: 4px; border-bottom: 1px solid #E2E7EB; border-right: {{col.edge}}">
<div style="display: inline-flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; font-size: 13px; line-height: 1.3; color: #222222; min-width: 76px">
<span>{{col.label}}</span>
<span style="font-size: 11px; font-weight: 600; color: #5F6B73">{{col.sub}}</span>
</div>
</th>
</sc-for>
</tr>
<tr>
<td class="sk" style="top: 100px; left: 0; background: #F7F9FA; border-bottom: 2px solid #E2E7EB"></td>
<th scope="row" class="sk" style="top: 100px; left: 56px; background: #F7F9FA; text-align: left; padding: 8px; font-weight: 700; color: #111111; border-bottom: 2px solid #E2E7EB">Class average <span style="display: block; font-size: 11px; font-weight: 400; color: #5F6B73">of students who started</span></th>
<td class="sk" style="top: 100px; left: 256px; background: #F7F9FA; padding: 8px; font-size: 13px; font-weight: 700; color: #4A555C; border-bottom: 2px solid #E2E7EB">{{classComp}}</td>
<td class="sk" style="top: 100px; left: 368px; background: #F7F9FA; padding: 8px; text-align: center; font-family: Lato, sans-serif; font-size: 18px; font-weight: 900; color: #111111; border-bottom: 2px solid #E2E7EB; border-right: 1px solid #E2E7EB">{{classOverall}}</td>
<sc-for list="{{avgCells}}" as="a" hint-placeholder-count="6">
<td style="top: 100px; background: #F7F9FA; text-align: center; padding: 6px 4px; border-bottom: 2px solid #E2E7EB; border-right: {{a.edge}}">
<div style="display: inline-flex; flex-direction: column; align-items: center">
<span style="font-family: Lato, sans-serif; font-size: 17px; font-weight: 900; color: #111111">{{a.avg}}</span></div>
</td>
</sc-for>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<tr>
<td class="sk" style="left: 0; background: {{r.rowBg}}; padding: 4px 8px 4px 24px; color: #5F6B73; border-bottom: 1px solid #EEF2F5">{{r.num}}</td>
<td class="sk" style="left: 56px; background: {{r.rowBg}}; padding: 6px 8px; border-bottom: 1px solid #EEF2F5">

      var lo = list.length ? Math.min.apply(null, list) : null, loIdx = list.indexOf(lo), bestIdx = list.lastIndexOf(ai);

      v.selTriesText = list.length ? list.length + (list.length === 1 ? ' attempt' : ' attempts') + ' \u00b7 lowest ' + lo + ' \u00b7 best ' + ai : '';
      v.selInputLabel = o ? 'Edit teacher score' : 'Adjust this exercise score';
      v.attempts = list.map(function (sc, i) {
        var tags = [];
        if (i === bestIdx) tags.push({ text: 'Best', bg: '#D6F0EE', fg: '#123F3B' });
        if (i === loIdx && list.length > 1) tags.push({ text: 'Lowest', bg: '#EEF2F5', fg: '#4A555C' });
        if (suspicious(sc, ai)) tags.push({ text: 'Check audio', bg: '#FDEFD3', fg: '#5C3D00' });
        var playing = st.playing === i;
        return {
          n: i + 1, score: sc, fg: textFg(sc), tags: tags,
          top: i === 0 ? '0' : '1px solid #EEF2F5', bg: playing ? '#F2FBFA' : '#FFFFFF',
          playing: playing, paused: !playing, btnBg: playing ? '#0B6B63' : '#00A094',
          playLabel: (playing ? 'Pause' : 'Play') + ' attempt ' + (i + 1),
          play: function () { self.setState({ playing: playing ? -1 : i }); }
        };
      });
      v.remindOne = function () { self.setState({ toast: 'Reminder sent to ' + stu.name + '.' }); };
      v.save = function () {
        var n = parseInt(self.state.draft, 10);
        if (isNaN(n) || n < 0 || n > 100) { self.setState({ err: 'Enter a score from 0 to 100.' }); return; }
        var next = Object.assign({}, self.state.ov);
        next[key] = { score: n, by: '[Teacher name]', note: o ? o.note : '' };
        self.setState({ ov: next, err: '' });
      };
      v.revert = function () {
        var next = Object.assign({}, self.state.ov); delete next[key];
        self.setState({ ov: next, draft: '', err: '' });
      };
    } else {
      v.lessonHref = '#'; v.attempts = [];
      v.selName = ''; v.selFirstName = ''; v.selLesson = ''; v.selFinal = ''; v.selBg = '#F2F2F2'; v.selFg = '#222222'; v.selRing = 'none';
      v.selSource = ''; v.selAi = ''; v.selStarted = false; v.selNotStarted = false; v.selIsOv = false; v.selHasNote = false; v.selNote = '';
      v.selFlag = false; v.selFlagText = ''; v.selTriesText = ''; v.selInputLabel = '';
      v.remindOne = function () {}; v.save = function () {}; v.revert = function () {};
    }
    return v;
  }
}
mountDC(Component, 'tpl', 'app');
