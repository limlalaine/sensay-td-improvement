<thead><tr><th scope="col" style="padding: 12px 8px 12px 16px; border-bottom: 1px solid #E2E7EB"><span style="position: absolute; left: -9999px">Reorder</span></th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">#</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Lesson</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Availability</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Exercises</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Recordings</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Last recording</th><th scope="col" style="padding: 12px 16px 12px 8px; border-bottom: 1px solid #E2E7EB"><span style="position: absolute; left: -9999px">Open</span></th></tr></thead>
<tbody>
<sc-for list="{{lessons}}" as="l" hint-placeholder-count="4">
<tr onDragOver="{{l.dragOver}}" onDrop="{{l.drop}}" style="{{l.rowStyle}}">
<td data-label="" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px; padding-left: 16px; width: 32px"><span draggable="true" onDragStart="{{l.dragStart}}" onDragEnd="{{l.dragEnd}}" title="Drag to reorder" aria-label="Drag to reorder" style="display: inline-flex; cursor: grab; padding: 8px 4px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="#8A959C"><circle cx="5.5" cy="3.5" r="1.3"/><circle cx="10.5" cy="3.5" r="1.3"/><circle cx="5.5" cy="8" r="1.3"/><circle cx="10.5" cy="8" r="1.3"/><circle cx="5.5" cy="12.5" r="1.3"/><circle cx="10.5" cy="12.5" r="1.3"/></svg></span></td>
<td data-label="" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px; width: 32px; color: #4A555C">{{l.n}}</td>
<td data-label="" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px"><div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><a href="{{l.href}}" style="font-weight: 700; font-size: 15px; text-decoration: none">{{l.name}}</a><sc-if value="{{l.isNew}}" hint-placeholder-val="{{ false }}"><span style="background: #D6F0EE; color: #0B6B63; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700">New</span></sc-if></div><div style="color: #5F6B73; font-size: 13px; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{l.sub}}</div></td>
<td data-label="Availability" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px"><span style="display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; background: {{l.avBg}}; color: {{l.avFg}}">{{l.av}}</span></td>
<td data-label="Exercises" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px">{{l.ex}}</td>
<td data-label="Recordings" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px">{{l.recs}}</td>
<td data-label="Last recording" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px; color: #4A555C; white-space: nowrap"><span title="{{l.lastFull}}">{{l.last}}</span></td>
<td data-label="" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px; padding-right: 16px; text-align: right; white-space: nowrap"><a href="{{l.href}}" aria-label="Open {{l.name}}" style="display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 8px; color: #0B6B63"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></a></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>
</div>
<sc-if value="{{dlgOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; z-index: 80; background: rgba(17,17,17,.45); display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; box-sizing: border-box; overflow-y: auto">
<div role="dialog" aria-modal="true" aria-labelledby="newLessonTitle" style="background: #FFFFFF; border-radius: 12px; box-shadow: 0 16px 48px rgba(17,17,17,.25); width: 100%; max-width: 560px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #E2E7EB">
<h2 id="newLessonTitle" style="margin: 0; font-family: Lato, sans-serif; font-size: 20px; font-weight: 700; color: #111111">Create lesson</h2>
<button onClick="{{closeDlg}}" aria-label="Close" style="width: 44px; height: 44px; border: 0; background: #F2F2F2; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #222222">Lesson name<input id="lessonName" type="text" value="{{draftName}}" onInput="{{onName}}" placeholder="e.g. Little Red Riding Hood" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid #C0C0C0; border-radius: 8px; font: 400 14px 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #222222"><span>Description or source link <span style="font-size: 13px; font-weight: 400; color: #5F6B73">(optional)</span></span><input type="text" placeholder="Shown to students under the lesson name" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid #C0C0C0; border-radius: 8px; font: 400 14px 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; background: #FFFFFF"></label>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; color: #222222; margin-bottom: 6px; padding: 0">When can students do it?</legend>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 32px"><input type="radio" name="avail" checked="{{avAlways}}" onChange="{{setAlways}}" style="width: 18px; height: 18px">Always available</label>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 32px"><input type="radio" name="avail" checked="{{avDates}}" onChange="{{setDates}}" style="width: 18px; height: 18px">Between dates</label>
<sc-if value="{{avDates}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px; padding-left: 28px"><div style="display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Opens<input id="opens" type="date" value="{{openDate}}" onInput="{{onOpen}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid #C0C0C0; border-radius: 8px; font: 400 14px 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; background: #FFFFFF; width: auto"></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Closes<input id="closes" type="date" value="{{closeDate}}" onInput="{{onClose}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid #C0C0C0; border-radius: 8px; font: 400 14px 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; background: #FFFFFF; width: auto"></label></div><span style="font-size: 13px; font-weight: 400; color: #5F6B73">Students see the lesson from the opening date and can record until the end of the closing date.</span></div></sc-if>
</fieldset>
<p style="margin: 0; font-size: 13px; font-weight: 400; color: #5F6B73">You'll add exercises next. To reuse ready-made lessons, use <b>Add from Practice Packs</b> instead.</p>
<sc-if value="{{dlgErr}}" hint-placeholder-val="{{ false }}"><div role="alert" style="font-size: 13px; color: #B42323">Give the lesson a name.</div></sc-if>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid #E2E7EB">
<button onClick="{{closeDlg}}" style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap">Cancel</button>
<button onClick="{{createLesson}}" style="background: #00A094; border: 0; color: #FFFFFF; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap">Create lesson</button>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div role="status" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; background: #111111; color: #FFFFFF; border-radius: 8px; padding: 12px 16px; font-size: 14px; display: flex; gap: 16px; align-items: center; box-shadow: 0 8px 24px rgba(17,17,17,.25)">{{toastText}}<sc-if value="{{canUndo}}" hint-placeholder-val="{{ false }}"><button onClick="{{undo}}" style="background: none; border: 0; color: #9ADBD5; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer">Undo</button></sc-if><button onClick="{{dismissToast}}" style="background: none; border: 0; color: #9ADBD5; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer">Dismiss</button></div></sc-if>
</div>
</div>
</div>
</script>
<script src="dc-lite.js"></script>
<script>
function orderOf(ord, n) { var o = (ord || []).filter(function (k) { return k < n; }); for (var k = 0; k < n; k++) if (o.indexOf(k) < 0) o.push(k); return o; }
function dndRow(self, pos, label) {
  var st = self.state, dragging = st.drag !== null && st.drag !== undefined;
  return {
    dragStart: function (e) { try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(pos)); } catch (x) {} self.setState({ drag: pos }); },
    dragEnd: function () { self.setState({ drag: null, over: null }); },
    dragOver: function (e) { if (self.state.drag === null || self.state.drag === undefined) return; e.preventDefault(); if (self.state.over !== pos) self.setState({ over: pos }); },
    drop: function (e) {
      e.preventDefault(); var from = self.state.drag;
      if (from === null || from === undefined || from === pos) { self.setState({ drag: null, over: null }); return; }
      var o = self.curOrder.slice(), x = o.splice(from, 1)[0]; o.splice(pos, 0, x);
      self.setState({ prevOrd: self.curOrder.slice(), ord: o, drag: null, over: null, toast: label + ' order saved. Students see the new order.', undoOrd: true });
    },
    rowStyle: (dragging && st.over === pos && st.drag !== pos ? 'outline: 2px solid #00A094; outline-offset: -2px;' : '') + (st.drag === pos ? 'opacity: .5;' : '')
  };
}
function undoVals(self) {
  return { canUndo: !!self.state.toast && !!self.state.undoOrd, undo: function () { self.setState({ ord: self.state.prevOrd, prevOrd: null, undoOrd: false, toast: 'Order restored.' }); } };
}
var LESSONS = [
  { name: 'How to Use Sensay', sub: 'Getting started · 1 exercise to try every feature', av: 'Always available', kind: 'always', ex: 1, recs: '182', last: '1 year ago', lastFull: 'May 12, 2025' },
  { name: 'Goldilocks & the Three Bears', sub: 'https://storiestogrowby.org/story/goldilocks-and-the-three-bears-bedtime-stories-for-kids/', av: 'Open until Dec 20, 2026', kind: 'open', ex: 5, recs: '640', last: '6 days ago', lastFull: 'Nov 18, 2026' },
  { name: 'The Three Little Pigs', sub: 'https://storiestogrowby.org/story/the-three-little-pigs-fairy-tale-for-kids/', av: 'Open until Jan 15, 2027', kind: 'open', ex: 4, recs: '170', last: '8 days ago', lastFull: 'Nov 16, 2026' },
  { name: 'Jack and the Beanstalk', sub: 'https://storiestogrowby.org/story/jack-and-the-beanstalk-story-for-kids/', av: 'Open until Dec 31, 2026', kind: 'open', ex: 3, recs: '48', last: '2 weeks ago', lastFull: 'Nov 10, 2026' },
  { name: 'The Gingerbread Man', sub: 'No exercises yet · open it to add the first one', av: 'Always available', kind: 'always', ex: 0, recs: '0', last: '–', lastFull: 'No recordings yet', href: 'lesson-empty.html' }
];
function fmtDate(iso) { var M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']; var p = (iso || '').split('-'); return p.length === 3 ? M[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0] : iso; }
var AV = { always: ['#EEF2F5', '#4A555C'], open: ['#D3EEDD', '#1E5C3C'], scheduled: ['#E8EAFF', '#33438A'], ended: ['#F2F2F2', '#5F6B73'] };
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { added: [], dlg: false, name: '', avail: 'always', err: false, toast: '', open: '2026-12-01', close: '2026-12-20' }; }
  renderVals() {
    var self = this, st = this.state;
    var all = LESSONS.concat(st.added), o = orderOf(st.ord, all.length); self.curOrder = o;
    return Object.assign(undoVals(self), {
      lessons: o.map(function (k, i) { var l = all[k]; return Object.assign(dndRow(self, i, 'Lesson'), { href: l.href || 'lesson-exercises.html', n: i + 1, name: l.name, sub: l.sub, av: l.av, avBg: AV[l.kind][0], avFg: AV[l.kind][1], ex: l.ex, recs: l.recs, last: l.last, lastFull: l.lastFull, isNew: !!l.isNew }); }),
      lessonCount: all.length,
      dlgOpen: st.dlg, draftName: st.name, dlgErr: st.err, avAlways: st.avail === 'always', avDates: st.avail === 'dates',
      openDate: st.open, closeDate: st.close, onOpen: function (e) { self.setState({ open: e.target.value }); }, onClose: function (e) { self.setState({ close: e.target.value }); },
      openDlg: function () { self.setState({ dlg: true, name: '', avail: 'always', err: false, toast: '' }); },
      closeDlg: function () { self.setState({ dlg: false, err: false }); },
      onName: function (e) { self.setState({ name: e.target.value, err: false }); },
      setAlways: function () { self.setState({ avail: 'always' }); },
      setDates: function () { self.setState({ avail: 'dates' }); },
      createLesson: function () {
        var n = (self.state.name || '').trim();
        if (!n) { self.setState({ err: true }); return; }
        var dates = self.state.avail === 'dates';
        var l = { name: n, sub: 'No exercises yet · open it to add the first one', av: dates ? 'Opens ' + fmtDate(self.state.open) + ' \u2013 ' + fmtDate(self.state.close) : 'Always available', kind: dates ? 'scheduled' : 'always', ex: 0, recs: '0', last: '–', lastFull: 'No recordings yet', isNew: true, href: 'lesson-empty.html' };
        self.setState({ added: self.state.added.concat([l]), dlg: false, toast: '“' + n + '” created. Open it to add exercises.', undoOrd: false });
      },
      toast: !!st.toast, toastText: st.toast, dismissToast: function () { self.setState({ toast: '' }); }
    });
  }
}
mountDC(Component, 'tpl', 'app');
</script>
</body>
</html>
