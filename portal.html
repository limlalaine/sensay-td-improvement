<script type="text/x-dc-template" id="tpl">
<div style="font-family:'Noto Sans','Noto Sans TC',sans-serif;color:#222222;min-height:2600px;background:#EEF2F5">

          <div style="padding:10px 12px;border-bottom:1px solid #E2E7EB;margin-bottom:4px">

            <div style="color:#5F6B73;font-size:13px">Owner · Admin · Teacher</div>
            <div style="color:#5F6B73;font-size:13px">Sensay School (L)</div>
          </div>
          <button role="menuitem" style="text-align:left;border:0;background:none;color:#4A555C;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer">My profile</button>
          <button role="menuitem" style="text-align:left;border:0;background:none;color:#4A555C;padding:10px 12px;font:inherit;font-size:14px;border-top:1px solid #E2E7EB;margin-top:4px;cursor:pointer">Sign out</button>
        </div>
        </sc-if>
      </div>
    </div>
  </header>
  <div style="display:flex;flex-wrap:wrap">
    <nav aria-label="Main" style="flex:0 0 240px;width:240px;padding:24px 16px;border-right:1px solid #E2E7EB;background:#FFFFFF;box-sizing:border-box;display:flex;flex-direction:column;gap:24px;font-family:'Noto Sans','Noto Sans TC',sans-serif"><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#4A555C;font-weight:700;margin:0 0 6px 12px">MY TEACHING</div><button onClick="{{go_dash}}" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;{{st_dash}}">Dashboard</button><a href="index.html" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">My Classes</a><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">All Recordings</a><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Practice Packs</a></div><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#4A555C;font-weight:700;margin:0 0 6px 12px">ORGANIZATION MANAGEMENT</div><button onClick="{{go_ov}}" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;{{st_ov}}">Overview</button><button onClick="{{go_teach}}" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;{{st_teach}}">Teachers</button><button onClick="{{go_stud}}" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;{{st_stud}}">Students</button><button onClick="{{go_ros}}" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;{{st_ros}}">Rosters</button><button onClick="{{go_cls}}" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;{{st_cls}}">Classes</button><button onClick="{{go_bill}}" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;{{st_bill}}">Plan &amp; billing</button></div><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#4A555C;font-weight:700;margin:0 0 6px 12px">HELP &amp; SUPPORT</div><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Tutorial Videos</a><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Help Desk</a><a href="#" style="display:block;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none">Contact Sensay</a></div></nav>
    <sc-if value="{{isDash}}" hint-placeholder-val="{{ false }}">
    <main style="flex:999 1 560px;min-width:0;padding:32px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px;max-width:1360px;margin:0 auto">
      <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start">
        <div>

          <p style="margin:0;color:#5F6B73;font-size:14px">Your classes</p>
        </div>
        <button style="background:#00A094;color:#fff;border:0;border-radius:8px;min-height:44px;padding:0 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer">+ Invite students</button>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
        <p style="margin:0;color:#5F6B73;font-size:14px">Nov 1 – Nov 24, 2026 · compared with Oct 8 – Oct 31, 2026</p>
        <div role="group" aria-label="Period" style="display:flex;gap:8px;flex-wrap:wrap">
          <button style="background:#fff;border:1px solid #D5DCE1;border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;color:#4A555C">Last 7 days</button>
          <button aria-pressed="true" style="background:#E6F7F5;border:1px solid #00A094;border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;color:#0B6B63;font-weight:600">This month</button>
          <button style="background:#fff;border:1px solid #D5DCE1;border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;color:#4A555C">Last 3 months</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
        <div style="background:#FFFFFF;border-radius:12px;padding:16px 24px;box-shadow:0 1px 2px rgba(17,17,17,0.06)">
          <div style="color:#4A555C;font-size:13px;font-weight:600">Students who recorded</div>
          <div style="margin:8px 0"><span style="font-family:Lato,sans-serif;font-size:31px;font-weight:900">1</span> <span style="color:#5F6B73;font-size:16px">of 12 in my classes</span></div>
          <div style="color:#0B6B63;font-size:13px">▲ 1 vs the period before</div>
        </div>
        <div style="background:#FFFFFF;border-radius:12px;padding:16px 24px;box-shadow:0 1px 2px rgba(17,17,17,0.06)">
          <div style="color:#4A555C;font-size:13px;font-weight:600">Recordings</div>
          <div style="margin:8px 0"><span style="font-family:Lato,sans-serif;font-size:31px;font-weight:900">1</span></div>
          <div style="color:#0B6B63;font-size:13px">▲ 1 vs the period before</div>
        </div>
        <div style="background:#FFFFFF;border-radius:12px;padding:16px 24px;box-shadow:0 1px 2px rgba(17,17,17,0.06)">
          <div style="color:#4A555C;font-size:13px;font-weight:600">Average practice time</div>
          <div style="margin:8px 0"><span style="font-family:Lato,sans-serif;font-size:31px;font-weight:900">[X]</span> <span style="color:#5F6B73;font-size:16px">min / student</span></div>
          <div style="color:#5F6B73;font-size:13px">Metric to confirm</div>
        </div>
      </div>

      <section style="background:#FFFFFF;border-radius:12px;padding:16px 24px;box-shadow:0 1px 2px rgba(17,17,17,0.06)">
        <h2 style="margin:0 0 8px;font-family:Lato,sans-serif;font-weight:700;color:#111111;font-size:20px;display:flex;align-items:center;gap:10px">Needs attention <span style="background:#FDEFD3;color:#8A5A00;font-size:13px;border-radius:999px;padding:2px 10px">3</span></h2>
        <p style="margin:0 0 8px;color:#5F6B73;font-size:14px">Only students in your classes</p>
        <div style="display:flex;flex-direction:column">
          <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 0;border-top:1px solid #E2E7EB">
            <span style="width:10px;height:10px;border-radius:50%;background:#B42323;flex:none"></span>
            <div style="flex:1 1 360px">
              <div style="font-weight:700;font-size:16px">8 students haven’t recorded in 14 days</div>
              <div style="color:#5F6B73;font-size:14px">A quick reminder often gets them practising again.</div>
            </div>
            <button style="background:#FFFFFF;border:1px solid #C0C0C0;color:#222222;border-radius:8px;min-height:40px;padding:0 16px;font:inherit;font-size:14px;font-weight:600">Send reminder</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 0;border-top:1px solid #E2E7EB">
            <span style="width:10px;height:10px;border-radius:50%;background:#F9A000;flex:none"></span>
            <div style="flex:1 1 360px">
              <div style="font-weight:700;font-size:16px">3 recordings are waiting for your feedback</div>
              <div style="color:#5F6B73;font-size:14px">Submitted in the last 7 days.</div>
            </div>
            <button style="background:#FFFFFF;border:1px solid #C0C0C0;color:#222222;border-radius:8px;min-height:40px;padding:0 16px;font:inherit;font-size:14px;font-weight:600">Review</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 0;border-top:1px solid #E2E7EB">
            <span style="width:10px;height:10px;border-radius:50%;background:#8A959C;flex:none"></span>
            <div style="flex:1 1 360px">
              <div style="font-weight:700;font-size:16px">2 students haven’t accepted their invitation</div>
              <div style="color:#5F6B73;font-size:14px">They can’t join your class until they accept.</div>
            </div>
            <button style="background:#FFFFFF;border:1px solid #C0C0C0;color:#222222;border-radius:8px;min-height:40px;padding:0 16px;font:inherit;font-size:14px;font-weight:600">Resend</button>
          </div>
        </div>
      </section>

      <section style="background:#FFFFFF;border-radius:12px;padding:16px 24px;box-shadow:0 1px 2px rgba(17,17,17,0.06)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px">
          <h2 style="margin:0;font-family:Lato,sans-serif;font-weight:700;color:#111111;font-size:20px">My classes</h2>
          <a href="index.html" style="font-size:14px">All classes →</a>
        </div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:14px;min-width:520px">
            <thead>
              <tr style="text-align:left;color:#5F6B73;font-size:13px">
                <th style="padding:12px 8px;font-weight:600;border-bottom:1px solid #E2E7EB">Class</th>
                <th style="padding:12px 8px;font-weight:600;border-bottom:1px solid #E2E7EB">Students</th>
                <th style="padding:12px 8px;font-weight:600;border-bottom:1px solid #E2E7EB">Students who recorded</th>
                <th style="padding:12px 8px;font-weight:600;border-bottom:1px solid #E2E7EB">Recordings</th>
              </tr>
            </thead>
            <tbody>
              <tr><td style="padding:14px 8px;border-bottom:1px solid #E2E7EB;font-weight:600"><a href="index.html">[Class name A]</a></td><td style="padding:14px 8px;border-bottom:1px solid #E2E7EB">6</td><td style="padding:14px 8px;border-bottom:1px solid #E2E7EB">1 of 6</td><td style="padding:14px 8px;border-bottom:1px solid #E2E7EB">1</td></tr>
              <tr><td style="padding:14px 8px;border-bottom:1px solid #E2E7EB;font-weight:600"><a href="index.html">[Class name B]</a></td><td style="padding:14px 8px;border-bottom:1px solid #E2E7EB">4</td><td style="padding:14px 8px;border-bottom:1px solid #E2E7EB">0 of 4</td><td style="padding:14px 8px;border-bottom:1px solid #E2E7EB">0</td></tr>
              <tr><td style="padding:14px 8px;font-weight:600"><a href="index.html">[Class name C]</a></td><td style="padding:14px 8px">2</td><td style="padding:14px 8px">0 of 2</td><td style="padding:14px 8px">0</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    </sc-if>
    <sc-if value="{{isOv}}" hint-placeholder-val="{{ true }}">
    <main style="flex:999 1 560px;min-width:0;padding:32px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px;max-width:1360px;margin:0 auto">
      <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#4A555C;font-weight:700">ORGANIZATION MANAGEMENT · SENSAY SCHOOL (L)</div>
          <h1 style="margin:4px 0 4px;font-family:Lato,sans-serif;font-weight:700;font-size:31px;line-height:1.15;color:#111111">Overview</h1>
          <p style="margin:0;color:#5F6B73;font-size:14px">How your organization is doing, and what needs attention</p>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button style="background:#FFFFFF;border:1px solid #C0C0C0;color:#222222;border-radius:8px;min-height:44px;padding:0 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer">Export CSV</button>
          <button style="background:#00A094;color:#fff;border:0;border-radius:8px;min-height:44px;padding:0 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer">+ Invite people</button>
        </div>
      </div>

      <section aria-label="Organization at a glance" style="background:#FFFFFF;border-radius:12px;padding:16px 24px;box-shadow:0 1px 2px rgba(17,17,17,0.06);display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline">
          <h2 style="margin:0;font-family:Lato,sans-serif;font-weight:700;color:#111111;font-size:20px">At a glance <span style="font-weight:400;color:#5F6B73;font-size:14px">· right now, not affected by the period below</span></h2>
          <button onClick="{{go_bill}}" style="background:none;border:0;padding:0;font:inherit;font-size:14px;font-weight:600;color:#0B6B63;cursor:pointer">Plan &amp; billing →</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 24px">
          <div style="display:flex;flex-direction:column;gap:2px;padding:4px 0">
            <div style="color:#4A555C;font-size:13px;font-weight:600">Subscription</div>
            <div style="font-family:Lato,sans-serif;font-size:20px;font-weight:900">Valid until Dec 31, 2099</div>
            
          </div>

          <div style="display:flex;flex-direction:column;gap:2px;padding:4px 0">
            <div style="color:#4A555C;font-size:13px;font-weight:600">Teachers</div>
            <div style="font-family:Lato,sans-serif;font-size:20px;font-weight:900">5 <span style="font-weight:400;color:#5F6B73;font-size:14px">/ 25</span></div>
            <div style="height:8px;background:#E2E7EB;border-radius:4px;display:flex;overflow:hidden;margin-top:6px;max-width:220px"><div style="width:12%;background:#00A094"></div><div style="width:8%;background:#F9A000"></div></div>
            <div style="color:#5F6B73;font-size:13px">3 joined · 2 invited</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;padding:4px 0">
            <div style="color:#4A555C;font-size:13px;font-weight:600">Students enrolled</div>
            <div style="font-family:Lato,sans-serif;font-size:20px;font-weight:900">31 <span style="font-weight:400;color:#5F6B73;font-size:14px">/ 250</span></div>
            <div style="height:8px;background:#E2E7EB;border-radius:4px;display:flex;overflow:hidden;margin-top:6px;max-width:220px"><div style="width:10.8%;background:#00A094"></div><div style="width:1.6%;background:#F9A000"></div></div>
            <div style="color:#5F6B73;font-size:13px">Includes 4 pending invitations</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;padding:4px 0">
            <div style="color:#4A555C;font-size:13px;font-weight:600">Active students this month</div>
            <div style="font-family:Lato,sans-serif;font-size:20px;font-weight:900">1</div>
            <div style="color:#5F6B73;font-size:13px">Submitted at least one recording</div>
          </div>

            <div style="font-family:Lato,sans-serif;font-size:20px;font-weight:900">39</div>
            <div style="color:#5F6B73;font-size:13px">Don’t count toward enrollment</div>
          </div>

            <div style="font-family:Lato,sans-serif;font-size:20px;font-weight:900">9,525</div>
            <div style="color:#5F6B73;font-size:13px">All time</div>
          </div>

        </div>
      </section>

      <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
        <p style="margin:0;color:#5F6B73;font-size:14px">Sep 7 – Nov 24, 2026 · Weeks run Monday to Sunday. The current week counts up to today.</p>
        <div role="group" aria-label="Period" style="display:flex;gap:8px;flex-wrap:wrap">
          <button style="background:#fff;border:1px solid #D5DCE1;border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;color:#4A555C">Last 4 weeks</button>
          <button aria-pressed="true" style="background:#E6F7F5;border:1px solid #00A094;border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;color:#0B6B63;font-weight:600">Last 12 weeks</button>
          <button style="background:#fff;border:1px solid #D5DCE1;border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;color:#4A555C">This year</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
        <div style="background:#FFFFFF;border-radius:12px;padding:16px 24px;box-shadow:0 1px 2px rgba(17,17,17,0.06)">
          <div style="color:#4A555C;font-size:13px;font-weight:600">Recordings</div>
          <div style="margin:8px 0 0"><span style="font-family:Lato,sans-serif;font-size:31px;font-weight:900">9</span> <span style="color:#5F6B73;font-size:16px"></span></div>
        </div>
        <div style="background:#FFFFFF;border-radius:12px;padding:16px 24px;box-shadow:0 1px 2px rgba(17,17,17,0.06)">
          <div style="color:#4A555C;font-size:13px;font-weight:600">Students who recorded</div>
