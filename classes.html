d:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg>Help Desk</a><a href="out-of-scope.html?p=Contact%20Sensay" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/></svg>Contact Sensay</a></div></nav>

<div style="flex: 999 1 560px; min-width: 0; background: #EEF2F5; font-family: 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; box-sizing: border-box; padding: 0 0 56px">
<div class="page-main" style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
<div>

</div>

<section style="background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 2px rgba(17,17,17,0.06); overflow: hidden">

</div>
<div role="group" aria-label="Show" style="display: flex; gap: 8px; flex-wrap: wrap">

</div>
</div>
<div style="overflow-x: auto">
<table class="rtable" style="width: 100%; border-collapse: collapse; min-width: 760px">
<thead><tr><th scope="col" style="padding: 12px 8px 12px 16px; border-bottom: 1px solid #E2E7EB; width: 44px"><span style="position: absolute; left: -9999px">Pinned</span></th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Class ↕</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Students ↕</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Recordings ↕</th><th scope="col" style="padding: 12px 8px; font-weight: 600; font-size: 13px; color: #4A555C; text-align: left; border-bottom: 1px solid #E2E7EB; white-space: nowrap">Last recording ↕</th><th scope="col" style="padding: 12px 16px 12px 8px; border-bottom: 1px solid #E2E7EB"><span style="position: absolute; left: -9999px">Actions</span></th></tr></thead>
<tbody>
<sc-if value="{{hasPinned}}" hint-placeholder-val="{{ true }}">

<sc-for list="{{pinnedList}}" as="c" hint-placeholder-count="3">
<tr>
<td data-label="" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px; padding-left: 16px; width: 44px"><button type="button" onClick="{{c.pin}}" aria-pressed="{{c.pinned}}" aria-label="{{c.pinLabel}}" title="{{c.pinLabel}}" style="width: 44px; height: 44px; border: 0; background: none; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><sc-if value="{{c.pinned}}" hint-placeholder-val="{{ false }}"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="#A15C00" stroke="#A15C00" stroke-width="1.5" stroke-linejoin="round"/></sc-if><sc-if value="{{c.unpinned}}" hint-placeholder-val="{{ true }}"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="#5F6B73" stroke-width="1.5" stroke-linejoin="round"/></sc-if></svg></button></td>
<td data-label="" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px"><div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><a href="class-lessons.html" style="font-weight: 700; font-size: 15px; text-decoration: none">{{c.name}}</a><sc-if value="{{c.shared}}" hint-placeholder-val="{{ true }}"><span style="background: #E8EAFF; color: #33438A; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700">Shared</span></sc-if></div><div style="color: #5F6B73; font-size: 13px">Owner: {{c.owner}} · Created <span title="{{c.created}}">{{c.createdShort}}</span></div></td>
<td data-label="Students" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px">{{c.students}}</td>
<td data-label="Recordings" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px">{{c.recs}}</td>
<td data-label="Last recording" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px; color: #4A555C; white-space: nowrap"><span title="{{c.lastFull}}">{{c.last}}</span></td>
<td data-label="" style="padding: 12px 8px; border-bottom: 1px solid #E2E7EB; vertical-align: middle; font-size: 14px; padding-right: 16px; text-align: right"><button aria-label="More actions for {{c.name}}: rename, duplicate, share, archive" style="background: #FFFFFF; border: 1px solid #C0C0C0; border-radius: 8px; width: 44px; height: 44px; font-size: 18px; color: #4A555C; cursor: pointer">⋯</button></td>
</tr>
</sc-for>
