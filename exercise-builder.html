<div class="builder">
<div style="display: flex; flex-direction: column; min-width: 0">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 14px; color: #4A555C"><span>{{listInfo}}</span><button type="button" onClick="{{toggleAll}}" style="background: none; border: 0; padding: 0; min-height: 36px; color: #0B6B63; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer">{{toggleAllLabel}}</button></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
<section id="card-{{c.id}}" onClick="{{c.select}}" onDragOver="{{c.dragOver}}" onDrop="{{c.drop}}" aria-label="Exercise {{c.n}}" style="background: #FFFFFF; border-radius: 12px; box-shadow: {{c.shadow}}; opacity: {{c.opacity}}; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; border-left: 4px solid {{c.edge}}">
<div onClick="{{c.toggleHead}}" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; cursor: pointer">
<span class="drag-h" draggable="true" onDragStart="{{c.dragStart}}" onDragEnd="{{c.dragEnd}}" onClick="{{c.stop}}" title="Drag to reorder" style="cursor: grab; color: #8A959C; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 40px; margin-left: -8px"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="3.5" r="1.3"/><circle cx="10.5" cy="3.5" r="1.3"/><circle cx="5.5" cy="8" r="1.3"/><circle cx="10.5" cy="8" r="1.3"/><circle cx="5.5" cy="12.5" r="1.3"/><circle cx="10.5" cy="12.5" r="1.3"/></svg></span>
<span style="width: 32px; height: 32px; border-radius: 50%; background: #E6F7F5; color: #0B6B63; display: inline-flex; align-items: center; justify-content: center; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; flex: none">{{c.n}}</span>
<span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 8px; background: #E6F7F5; color: #0B6B63; display: inline-flex; align-items: center; justify-content: center; flex: none"><sc-if value="{{c.t_reading}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg></sc-if><sc-if value="{{c.t_long}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 9h16M4 13h16M4 17h16M4 21h10"/></svg></sc-if><sc-if value="{{c.t_q}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M10 9.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2V13"/><path d="M12 16h.01"/></svg></sc-if><sc-if value="{{c.t_media}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></sc-if><sc-if value="{{c.t_self}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></sc-if><sc-if value="{{c.isPick}}" hint-placeholder-val="{{ f <sc-if value="{{c.isMin}}" hint-placeholder-val="{{ false }}"><label style="display: inline-flex; gap: 8px; align-items: center; font-weight: 400"><select id="min-{{c.id}}" onChange="{{c.onMin}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid #C0C0C0; border-radius: 8px; font: 400 14px 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; background: #FFFFFF; width: auto; min-height: 36px"><sc-for list="{{c.minOpts}}" as="o" hint-placeholder-count="2"><option value="{{o.v}}" selected="{{o.sel}}">{{o.v}}</option></sc-for></select>of {{c.kwCount}}</label></sc-if>
</div>
<div style="font-size: 13px; color: #4A555C; background: #FFFFFF; border-radius: 8px; padding: 8px 12px; border-left: 3px solid #4357AD">{{c.ruleSummary}}</div>
</div>
</sc-if>
<sc-if value="{{c.hasPat}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; background: #F7F9FA; border: 1px solid #E2E7EB; border-radius: 12px; padding: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #222222"><span>Sentence pattern</span><span style="font-size: 13px; font-weight: 400; color: #5F6B73; display: {{c.helpDisplay}}">Write the sentence students should say. Put the part that can change in [square brackets].</span><input id="pat-{{c.id}}" type="text" value="{{c.pattern}}" onInput="{{c.onPat}}" placeholder="e.g. I'm [number] years old." style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid #C0C0C0; border-radius: 8px; font: 400 14px 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; background: #FFFFFF; border-color: {{c.patBorder}}"></label>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: #4A555C">Insert a blank:
<button type="button" onClick="{{c.insNum}}" style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; min-height: 36px; font-weight: 600">[number]</button>
<button type="button" onClick="{{c.insWord}}" style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; min-height: 36px; font-weight: 600">[word]</button>
<button type="button" onClick="{{c.insName}}" style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; min-height: 36px; font-weight: 600">[name]</button>
<button type="button" onClick="{{c.insList}}" style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; min-height: 36px; font-weight: 600">[this / that]</button>
</div>
<div style="background: #FFFFFF; border-radius: 8px; padding: 10px 12px; border-left: 3px solid #4357AD; font-size: 15px; line-height: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
<span style="font-size: 13px; color: #4A555C; margin-right: 4px">Students say:</span><sc-for list="{{c.patParts}}" as="p" hint-placeholder-count="3"><sc-if value="{{p.blank}}" hint-placeholder-val="{{ false }}"><span style="background: #E8EAFF; color: #4357AD; border: 1px dashed #4357AD; border-radius: 6px; padding: 0 8px; font-size: 13px; font-weight: 700">{{p.label}}</span></sc-if><sc-if value="{{p.fixed}}" hint-placeholder-val="{{ true }}"><span>{{p.text}}</span></sc-if></sc-for>
</div>
<label style="display: inline-flex; gap: 8px; align-items: center; font-size: 14px; min-height: 32px; cursor: pointer"><input id="extra-{{c.id}}" type="checkbox" checked="{{c.extra}}" onChange="{{c.toggleExtra}}" style="width: 18px; height: 18px; accent-color: #00A094">Students can keep talking after the sentence</label>
</div>
</sc-if>
<sc-if value="{{c.hasTest}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; border: 1px dashed #A9B3BA; border-radius: 12px; padding: 12px 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #222222"><span>Try an answer</span><span style="font-size: 13px; font-weight: 400; color: #5F6B73">Type what a student might say to check your rule. Not saved.</span><input id="test-{{c.id}}" type="text" value="{{c.test}}" onInput="{{c.onTest}}" placeholder="e.g. I am eleven years old" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid #C0C0C0; border-radius: 8px; font: 400 14px 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; background: #FFFFFF"></label>
<sc-if value="{{c.hasResult}}" hint-placeholder-val="{{ false }}"><div role="status" style="font-size: 14px; font-weight: 600; border-radius: 8px; padding: 8px 12px; {{c.resultStyle}}">{{c.result}}</div></sc-if>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: #4A555C">
<span style="display: inline-flex; gap: 6px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>Recording up to {{c.recLen}} seconds</span>
<span>{{c.counts}}</span>
<sc-if value="{{c.hasErr}}" hint-placeholder-val="{{ false }}"><span role="alert" style="color: #B42323; font-weight: 600">{{c.err}}</span></sc-if>
</div>
</sc-if>
</section>

</sc-for>
</div>

<section id="add-bar" aria-label="Add exercise" style="margin-top: 16px; background: #FFFFFF; border: 1.5px dashed #A9B3BA; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<span style="font-weight: 700; font-size: 15px">Add new exercise</span>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px"><button type="button" onClick="{{add_reading}}" style="background: #FFFFFF; border: 1px solid #D5DCE1; border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; font-family: 'Noto Sans','Noto Sans TC',sans-serif"><span style="width: 36px; height: 36px; border-radius: 8px; background: #E6F7F5; color: #0B6B63; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg></span><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 14px; color: #222222">Short Reading</span><span style="font-size: 13px; color: #5F6B73; line-height: 1.4">Read a short text aloud. 30 seconds, optional picture.</span></span></button><button type="button" onClick="{{add_long}}" style="background: #FFFFFF; border: 1px solid #D5DCE1; border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; font-family: 'Noto Sans','Noto Sans TC',sans-serif"><span style="width: 36px; height: 36px; border-radius: 8px; background: #E6F7F5; color: #0B6B63; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 9h16M4 13h16M4 17h16M4 21h10"/></svg></span><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 14px; color: #222222">Long Reading</span><span style="font-size: 13px; color: #5F6B73; line-height: 1.4">Read a longer text aloud. 90 seconds.</span></span></button><button type="button" onClick="{{add_q}}" style="background: #FFFFFF; border: 1px solid #D5DCE1; border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; font-family: 'Noto Sans','Noto Sans TC',sans-serif"><span style="width: 36px; height: 36px; border-radius: 8px; background: #E6F7F5; color: #0B6B63; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M10 9.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2V13"/><path d="M12 16h.01"/></svg></span><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 14px; color: #222222">Question</span><span style="font-size: 13px; color: #5F6B73; line-height: 1.4">Answer a question. Check by open answer, exact answer, keywords or a sentence pattern.</span></span></button><button type="button" onClick="{{add_media}}" style="background: #FFFFFF; border: 1px solid #D5DCE1; border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; font-family: 'Noto Sans','Noto Sans TC',sans-serif"><span style="width: 36px; height: 36px; border-radius: 8px; background: #E6F7F5; color: #0B6B63; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></span><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 14px; color: #222222">Picture/Video Prompt</span><span style="font-size: 13px; color: #5F6B73; line-height: 1.4">Look at a picture or watch a video, then respond.</span></span></button><button type="button" onClick="{{add_self}}" style="background: #FFFFFF; border: 1px solid #D5DCE1; border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; font-family: 'Noto Sans','Noto Sans TC',sans-serif"><span style="width: 36px; height: 36px; border-radius: 8px; background: #E6F7F5; color: #0B6B63; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></span><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 14px; color: #222222">Self Practice</span><span style="font-size: 13px; color: #5F6B73; line-height: 1.4">Free speaking practice with no expected text.</span></span></button></div>
</section>
</div>

<aside class="pv-side" aria-label="Student preview" style="position: sticky; top: 16px; display: flex; flex-direction: column; gap: 8px">

<span style="align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; background: #E6F7F5; color: #0B6B63; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700"><sc-if value="{{pvt_reading}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg></sc-if><sc-if value="{{pvt_long}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 9h16M4 13h16M4 17h16M4 21h10"/></svg></sc-if><sc-if value="{{pvt_q}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M10 9.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2V13"/><path d="M12 16h.01"/></svg></sc-if><sc-if value="{{pvt_media}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></sc-if><sc-if value="{{pvt_self}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></sc-if>{{pvType}}</span>
<sc-if value="{{pvImage}}" hint-placeholder-val="{{ false }}"><div style="aspect-ratio: 4 / 3; background: #D6F0EE; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #0B6B63"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></div></sc-if>
<sc-if value="{{pvVideo}}" hint-placeholder-val="{{ false }}"><div style="aspect-ratio: 16 / 9; background: #222222; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg></div></sc-if>
<div style="font-size: 13px; font-weight: 700; color: #4A555C">{{pvInstruction}}</div>
<sc-if value="{{pvHasText}}" hint-placeholder-val="{{ true }}"><div style="background: #FFFFFF; border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.5; color: #222222; white-space: pre-line">{{pvText}}</div></sc-if>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 12px">
<span style="width: 64px; height: 64px; border-radius: 50%; background: #00A094; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></span>
<span style="font-size: 13px; color: #4A555C">Tap to record · up to {{pvLen}} seconds</span>

</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid #E2E7EB">

<button type="button" onClick="{{pvNext}}" style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; min-height: 36px; padding: 0 12px">Next ›</button>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #5F6B73; text-align: center">Click an exercise to preview it.</p>
</aside>
</div>
</div>

<div role="region" aria-label="Save changes" style="position: sticky; bottom: 0; z-index: 30; background: #FFFFFF; border-top: 1px solid #D5DCE1; box-shadow: 0 -2px 8px rgba(17,17,17,.06); margin-top: 24px">
<div style="max-width: 1360px; margin: 0 auto; padding: 12px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14px">{{barSummary}}</span><span style="font-size: 12px; color: #5F6B73">{{draftText}}</span></span>
<sc-if value="{{hasIssues}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: #B42323; font-weight: 600; font-size: 14px; background: #FBE1E1; border-radius: 8px; padding: 6px 10px">{{issuesText}}<button type="button" onClick="{{goNext}}" style="background: none; border: 0; padding: 0; color: #B42323; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; text-decoration: underline; cursor: pointer">Go to next</button></span></sc-if>
