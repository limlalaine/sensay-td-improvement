oke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>Classes</a><a href="portal.html" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/></svg>Plan &amp; billing</a></div><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#4A555C;font-weight:700;margin:0 0 6px 12px">HELP &amp; SUPPORT</div><a href="#" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10l6-3v10l-6-3z"/></svg>Tutorial Videos</a><a href="#" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg>Help Desk</a><a href="#" style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:15px;line-height:1.4;text-decoration:none;cursor:pointer;color:#4A555C;font-weight:400;background:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/></svg>Contact Sensay</a></div></nav>

<div style="background: #FFFFFF; border-bottom: 1px solid #D5DCE1">
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; min-height: 72px">
<nav aria-label="Breadcrumb" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: #5F6B73">

<div class="page-main" style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
<div>
<div style="font-size: 13px; font-weight: 700; color: #4A555C; text-transform: uppercase; letter-spacing: 0.04em">Goldilocks &amp; the Three Bears</div>
<h1 style="margin: 4px 0; font-family: Lato, sans-serif; font-weight: 700; font-size: 31px; line-height: 1.15; color: #111111">Add exercises</h1>
<p style="margin: 0; color: #5F6B73; font-size: 14px">Build as many as you need, then save them together. They're added after Part 5.</p>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" onClick="{{openPv}}" style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Preview as student</button>
<a href="lesson-exercises.html" style="background: #FFFFFF; border: 1px solid #C0C0C0; color: #222222; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none">Cancel</a>
<button type="button" onClick="{{saveAll}}" style="background: #00A094; border: 0; color: #FFFFFF; border-radius: 8px; min-height: 44px; padding: 0 16px; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none">{{saveLabel}}</button>
</div>
</div>

<div class="builder">
<div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
<section onClick="{{c.select}}" aria-label="Exercise {{c.n}}" style="background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 2px rgba(17,17,17,0.06); padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; border-left: 4px solid {{c.edge}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="width: 32px; height: 32px; border-radius: 50%; background: #E6F7F5; color: #0B6B63; display: inline-flex; align-items: center; justify-content: center; font: 700 14px 'Noto Sans','Noto Sans TC',sans-serif; flex: none">{{c.n}}</span>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4A555C"><span style="position: absolute; left: -9999px">Exercise type</span><select id="type-{{c.id}}" value="{{c.type}}" onChange="{{c.setType}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid #C0C0C0; border-radius: 8px; font: 400 14px 'Noto Sans','Noto Sans TC',sans-serif; color: #222222; background: #FFFFFF; width: auto; min-width: 200px; font-weight: 600"><sc-for list="{{c.opts}}" as="o" hint-placeholder-count="7"><option value="{{o.k}}" selected="{{o.sel}}">{{o.name}}</option></sc-for></select></label>
<div style="display: flex; gap: 6px; margin-left: auto">
<button type="button" onClick="{{c.up}}" aria-label="Move exercise {{c.n}} up" title="Move up" style="width: 40px; height: 40px; border: 1px solid #D5DCE1; background: #FFFFFF; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: #4A555C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
<button type="button" onClick="{{c.down}}" aria-label="Move exercise {{c.n}} down" title="Move down" style="width: 40px; height: 40px; border: 1px solid #D5DCE1; background: #FFFFFF; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: #4A555C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
<button type="button" onClick="{{c.dup}}" aria-label="Duplicate exercise {{c.n}}" title="Duplicate" style="width: 40px; height: 40px; border: 1px solid #D5DCE1; background: #FFFFFF; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: #4A555C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
<button type="button" onClick="{{c.del}}" aria-label="Delete exercise {{c.n}}" title="Delete" style="width: 40px; height: 40px; border: 1px solid #D5DCE1; background: #FFFFFF; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: #4A555C; color: #B42323"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</div>
</div>
<p style="margin: -6px 0 0; font-size: 13px; color: #5F6B73">{{c.blurb}}</p>

<script>

    ], sel: 0, showErr: false, paste: false, bulk: '', bulkType: 'reading', pv: false, toast: '', saved: false };
  }
  renderVals() {
    var self = this, st = this.state, cards = st.cards;
    var upd = function (i, patch) { var nx = self.state.cards.slice(); nx[i] = Object.assign({}, nx[i], patch); self.setState({ cards: nx, saved: false }); };
    var errOf = function (c) {
      var t = T[c.type];
      if (!c.title.trim()) return 'Add a name.';
      if (!t.optional && !c.text.trim()) return 'Add the ' + t.label.toLowerCase() + '.';
      if (t.answer && !c.answer.trim()) return 'Add the expected answer.';
      return '';
    };
    var on = 'background:#FFFFFF;color:#222222;box-shadow:0 1px 2px rgba(17,17,17,0.12);', off = 'background:transparent;color:#4A555C;';
    var list = cards.map(function (c, i) {
      var t = T[c.type], err = st.showErr ? errOf(c) : '', words = c.text.trim() ? c.text.trim().split(/\s+/).length : 0;
      return {
        id: c.id, n: 5 + i + 1, type: c.type, opts: KEYS.map(function (k) { return { k: k, name: T[k].name, sel: k === c.type ? true : null }; }), title: c.title, text: c.text, answer: c.answer, blurb: t.blurb,
        textLabel: t.label, textHint: t.hint, placeholder: t.ph, textOptional: !!t.optional, rows: t.rows,
        hasImage: !!t.image, hasVideo: !!t.video, hasAnswer: !!t.answer,
        isReading: c.type === 'reading', notReading: c.type !== 'reading', is30: c.len === 30, is90: c.len === 90, st30: c.len === 30 ? on : off, st90: c.len === 90 ? on : off,
        counts: words + ' words · ' + c.text.length + ' characters',
        edge: i === st.sel ? '#00A094' : '#FFFFFF',
        hasErr: !!err, err: err,
        titleBorder: err && !c.title.trim() ? '#B42323' : '#C0C0C0',
        textBorder: err && !t.optional && !c.text.trim() ? '#B42323' : '#C0C0C0',
        ansBorder: err && t.answer && !c.answer.trim() ? '#B42323' : '#C0C0C0',
        select: function () { if (self.state.sel !== i) self.setState({ sel: i }); },
        setType: function (e) { upd(i, { type: e.target.value, len: 30 }); },
        onTitle: function (e) { upd(i, { title: e.target.value }); },
        onText: function (e) { upd(i, { text: e.target.value }); },
        onAnswer: function (e) { upd(i, { answer: e.target.value }); },
        len30: function () { upd(i, { len: 30 }); }, len90: function () { upd(i, { len: 90 }); },
        up: function (ev) { if (ev) ev.stopPropagation(); if (i === 0) return; var nx = self.state.cards.slice(); var x = nx[i - 1]; nx[i - 1] = nx[i]; nx[i] = x; self.setState({ cards: nx, sel: i - 1 }); },
        down: function (ev) { if (ev) ev.stopPropagation(); if (i === self.state.cards.length - 1) return; var nx = self.state.cards.slice(); var x = nx[i + 1]; nx[i + 1] = nx[i]; nx[i] = x; self.setState({ cards: nx, sel: i + 1 }); },
        dup: function (ev) { if (ev) ev.stopPropagation(); uid++; var nx = self.state.cards.slice(); nx.splice(i + 1, 0, Object.assign({}, nx[i], { id: 'x' + uid, title: nx[i].title + ' (copy)' })); self.setState({ cards: nx, sel: i + 1 }); },
        del: function (ev) { if (ev) ev.stopPropagation(); var nx = self.state.cards.slice(); nx.splice(i, 1); self.setState({ cards: nx, sel: Math.max(0, Math.min(self.state.sel, nx.length - 1)) }); }
      };
    });
    var sel = cards[Math.min(st.sel, cards.length - 1)], ts = sel ? T[sel.type] : null;
    var parts = (st.bulk || '').split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    var bad = cards.filter(function (c) { return errOf(c); }).length;
    var v = {
      cards: list,
      saveLabel: 'Save ' + cards.length + (cards.length === 1 ? ' exercise' : ' exercises'),
      pvN: sel ? 5 + Math.min(st.sel, cards.length - 1) + 1 : 0, pvTotal: 5 + cards.length,
      pvTitle: sel ? (sel.title || 'Untitled') : 'Add an exercise to preview it', pvInstruction: ts ? ts.instr : '',
      pvText: sel ? (sel.text || (ts.optional ? '' : 'Your text will appear here.')) : '', pvHasText: !!(sel && (sel.text || !ts.optional)),
      pvImage: !!(ts && ts.image), pvVideo: !!(ts && ts.video), pvLen: sel ? (sel.type === 'reading' ? sel.len : 30) : 30,
      pvPrev: function () { self.setState({ sel: Math.max(0, self.state.sel - 1) }); },
      pvNext: function () { self.setState({ sel: Math.min(self.state.cards.length - 1, self.state.sel + 1) }); },
      pvOpen: st.pv, openPv: function () { self.setState({ pv: true }); }, closePv: function () { self.setState({ pv: false }); },
      pasteOpen: st.paste, togglePaste: function () { self.setState({ paste: !self.state.paste }); },
      bulkText: st.bulk, onBulk: function (e) { self.setState({ bulk: e.target.value }); },
      bulkType: st.bulkType, onBulkType: function (e) { self.setState({ bulkType: e.target.value }); },
      bulkCount: parts.length, bulkOpts: KEYS.map(function (k) { return { k: k, name: T[k].name, sel: k === st.bulkType ? true : null }; }),
      createBulk: function () {
        if (!parts.length) { self.setState({ toast: 'Paste some text first.', saved: false }); return; }
        var start = self.state.cards.length; var nx = self.state.cards.concat(parts.map(function (p, k) { return blank(self.state.bulkType, 5 + start + k + 1, p); }));
        self.setState({ cards: nx, bulk: '', paste: false, sel: start, toast: parts.length + ' exercises added below.', saved: false });
      },
      saveAll: function () {
        if (!self.state.cards.length) { self.setState({ toast: 'Add at least one exercise.', saved: false }); return; }
        if (bad) { self.setState({ showErr: true, toast: bad + (bad === 1 ? ' exercise needs' : ' exercises need') + ' attention before saving.', saved: false }); return; }
        self.setState({ showErr: false, toast: self.state.cards.length + ' exercises added to Goldilocks & the Three Bears.', saved: true });
      },
      toast: !!st.toast, toastText: st.toast, saved: st.saved, dismissToast: function () { self.setState({ toast: '' }); }
    };
    ['reading', 'readimg', 'qa', 'q', 'image', 'video', 'self'].forEach(function (k) {
      v['add_' + k] = function () { var nx = self.state.cards.concat([blank(k, 5 + self.state.cards.length + 1)]); self.setState({ cards: nx, sel: nx.length - 1 }); };
    });
    return v;
  }
}
mountDC(Component, 'tpl', 'app');
